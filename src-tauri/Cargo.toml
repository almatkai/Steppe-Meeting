[package]
name = "steppe-desktop"
version = "0.2.0-beta.4"
description = "Steppe Meeting Desktop"
edition = "2021"

[features]
# Never enabled by build-beta.py; fixture binaries are rejected by its audit.
packaged-updater-fixture = []

[lib]
name = "steppe_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "macos-private-api", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
screencapturekit = { version = "10.0.3", features = ["macos_15_0"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
core-graphics = "0.25"
core-foundation = "0.10"
