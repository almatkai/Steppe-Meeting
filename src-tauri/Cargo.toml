[package]
name = "steppe-desktop"
version = "0.1.0"
description = "Steppe Meeting Desktop"
edition = "2021"
default-run = "steppe-desktop"

[[bin]]
name = "steppe-desktop"
path = "src/main.rs"

[lib]
name = "steppe_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "10.0.3", features = ["macos_15_0"] }
